[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Draft content (unapproved tribute, placeholder details) is visible on
# deploy previews and branch deploys for review, never on production.
[context.deploy-preview.environment]
  VITE_SHOW_DRAFTS = "true"
[context.branch-deploy.environment]
  VITE_SHOW_DRAFTS = "true"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
